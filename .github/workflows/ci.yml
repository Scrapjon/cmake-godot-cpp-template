# Builds the extension with CMake on every push and pull request.
name: Continuous Integration
on:
  workflow_call:
  push:
  pull_request:
  merge_group:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        target: [template_debug, template_release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DGODOTCPP_TARGET=${{ matrix.target }} -DCMAKE_BUILD_TYPE=${{ matrix.target == 'template_release' && 'Release' || 'Debug' }}

      - name: Build
        run: cmake --build build --parallel --config ${{ matrix.target == 'template_release' && 'Release' || 'Debug' }}
